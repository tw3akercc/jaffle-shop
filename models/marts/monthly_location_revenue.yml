models:
  - name: monthly_location_revenue
    description: '{{ doc("monthly_location_revenue") }}'
    columns:
      - name: location_id
        description: '{{ doc("monthly_location_revenue__location_id") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('locations')
              field: location_id

      - name: location_name
        description: '{{ doc("monthly_location_revenue__location_name") }}'
        data_tests:
          - not_null

      - name: report_month
        description: '{{ doc("monthly_location_revenue__report_month") }}'
        data_tests:
          - not_null

      - name: monthly_revenue
        description: '{{ doc("monthly_location_revenue__monthly_revenue") }}'
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_order_count
        description: '{{ doc("monthly_location_revenue__monthly_order_count") }}'
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: month_over_month_growth_pct
        description: '{{ doc("monthly_location_revenue__month_over_month_growth_pct") }}'
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "is null or month_over_month_growth_pct = month_over_month_growth_pct"
              # second condition checks for finite number (not nan or inf)

      - name: cumulative_revenue
        description: '{{ doc("monthly_location_revenue__cumulative_revenue") }}'
        data_tests:
          - not_null
          - cumulative_revenue_non_decreasing:
              partition_by: location_id

      - name: monthly_revenue_pct_of_total
        description: '{{ doc("monthly_location_revenue__monthly_revenue_pct_of_total") }}'
        data_tests:
          - not_null

    data_tests:
      - unique:
          column_name: "location_id || '-' || report_month"
