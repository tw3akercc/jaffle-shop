models:
  - name: product_performance
    description: Product performance mart summarizing key metrics for each product across all time. One row per product.
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "gross_margin_pct is null or (gross_margin_pct >= 0 and gross_margin_pct <= 1)"
    columns:
      - name: product_id
        description: Primary key for the product
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('products')
              field: product_id
      - name: product_name
        description: Name of the product
        data_tests:
          - not_null
      - name: product_type
        description: Type/category of the product
      - name: product_description
        description: Description of the product
      - name: total_units_sold
        description: Total count of units sold for this product
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: total_units_sold
      - name: total_revenue
        description: Total revenue generated by this product
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: total_revenue
      - name: total_supply_cost
        description: Total supply cost for this product
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: total_supply_cost
      - name: gross_profit
        description: Total gross profit (revenue - supply cost)
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: gross_profit
      - name: gross_margin_pct
        description: Gross margin as percentage of revenue
      - name: distinct_order_count
        description: Number of distinct orders containing this product
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: distinct_order_count
      - name: distinct_location_count
        description: Number of distinct locations where this product was sold
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: distinct_location_count
      - name: avg_price_per_unit
        description: Average price per unit sold
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              column_name: avg_price_per_unit
      - name: revenue_rank
        description: Rank of product by total revenue (1 = highest)
