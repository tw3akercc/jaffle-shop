version: 2

models:
  - name: location_revenue_monthly
    description: '{{ doc("location_revenue_monthly") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - location_id
            - revenue_month
    columns:
      - name: location_id
        description: '{{ doc("location_revenue_monthly__location_id") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('locations')
              field: location_id
      - name: location_name
        description: '{{ doc("location_revenue_monthly__location_name") }}'
        data_tests:
          - not_null
      - name: revenue_month
        description: '{{ doc("location_revenue_monthly__revenue_month") }}'
        data_tests:
          - not_null
      - name: monthly_revenue
        description: '{{ doc("location_revenue_monthly__monthly_revenue") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: monthly_order_count
        description: '{{ doc("location_revenue_monthly__monthly_order_count") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: mom_revenue_growth_pct
        description: '{{ doc("location_revenue_monthly__mom_revenue_growth_pct") }}'
      - name: cumulative_revenue
        description: '{{ doc("location_revenue_monthly__cumulative_revenue") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: pct_of_location_total_revenue
        description: '{{ doc("location_revenue_monthly__pct_of_location_total_revenue") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
